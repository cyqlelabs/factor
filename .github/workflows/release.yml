name: Release

# Two ways in: a hand-pushed tag, or the auto-tag job in ci.yml calling this
# workflow directly. The call is not optional plumbing — a tag pushed with
# GITHUB_TOKEN does not trigger workflows, so the push trigger alone would
# never fire for an automatic release.
#
# The two paths arrive with different work already done, which is what every
# `if:` below is about. On the call path the tag job has already tested,
# cross-compiled with the version stamped in, and uploaded the binaries, so
# there is nothing left to do but publish them. A hand-pushed tag has had none
# of that and builds here.
#
# `inputs` is empty on the push path, which is both how the steps tell the two
# apart and why `inputs.version || github.ref_name` resolves to the tag either
# way.
on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      version:
        description: The tag to build and publish.
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: inputs.version == ''
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - uses: actions/setup-go@v5
        if: inputs.version == ''
        with:
          go-version-file: go.mod
      - name: test
        if: inputs.version == ''
        run: go test ./...
      - name: build
        if: inputs.version == ''
        env:
          TAG: ${{ github.ref_name }}
        run: make build-all VERSION="$TAG"
      - name: binaries from the tag job
        if: inputs.version != ''
        uses: actions/download-artifact@v4
        with:
          name: release-binaries
          path: dist
      - name: checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          # Explicit: on the workflow_call path github.ref is the branch, not
          # the tag, so the default would publish a release named "main".
          tag_name: ${{ inputs.version || github.ref_name }}
          files: dist/*
          generate_release_notes: true
