name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: test (race)
        run: go test -race ./...
      - name: test (nobrowser tag)
        run: go test -tags nobrowser ./...
      - name: coverage gate
        run: make cover

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Package-level scanning instead of the default symbol level: the SSA
      # builder govulncheck uses for symbol analysis panics on a transitive
      # chromedp dependency ("got jsontext.Value, want variadic parameter of
      # unnamed slice or string type"). Package level still reports every
      # vulnerable package this module actually imports.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck -scan package ./...

  build:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: cross-compile all targets
        run: make build-all
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/
          retention-days: 7
