name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Recency wins: a newer push cancels the older run's still-running jobs, so
# two pushes landing close together spend one CI run, not two. The
# cancellation lives on the pre-tag jobs rather than the workflow, because the
# tag job must never be cancellable — killing it between pushing a tag and
# publishing its release would leave a version with no binaries. An older run
# whose tests are cancelled simply never reaches its tag job, and the newer
# run releases everything both pushes carried.
jobs:
  test:
    runs-on: ubuntu-latest
    concurrency:
      group: ci-test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The desktop grid-vision tests drive a real X server end to end, and a
      # build that skipped them is a build whose desktop path nobody ran. So
      # this is not best-effort: each attempt is bounded so a stalled mirror
      # cannot hold the run (one did, for half an hour), it retries a
      # transient failure, and if the helpers still will not install the job
      # fails — no tag, no release, rather than a green tick over tests that
      # never happened.
      - name: install desktop test helpers
        timeout-minutes: 12
        run: |
          for attempt in 1 2 3; do
            if timeout 120 sudo apt-get update && \
               timeout 240 sudo apt-get install -y --no-install-recommends xvfb scrot xdotool x11-apps; then
              exit 0
            fi
            echo "attempt $attempt did not install the helpers; retrying in 15s"
            sleep 15
          done
          echo "the desktop test helpers could not be installed, so the grid-vision tests cannot run; failing rather than shipping untested"
          exit 1
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: test (race)
        run: go test -race ./...
      - name: test (nobrowser tag)
        run: go test -tags nobrowser ./...
      - name: coverage gate
        run: make cover
      # Publish the total from the profile make cover just wrote to the gist the
      # README's coverage badge reads. Main only: a PR's number isn't the shipped one.
      - name: coverage percentage
        id: cov
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "pct=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')" >> "$GITHUB_OUTPUT"
      - name: coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        # Cosmetic: a missing GIST_TOKEN or a gist API hiccup must not fail the
        # test job, which tag and release both gate on.
        continue-on-error: true
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: 180b17501295a75b23122fc6c9eca223
          filename: factor-coverage.json
          label: coverage
          message: ${{ steps.cov.outputs.pct }}%
          valColorRange: ${{ steps.cov.outputs.pct }}
          minColorRange: 80
          maxColorRange: 100

  lint:
    runs-on: ubuntu-latest
    concurrency:
      group: ci-lint-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  govulncheck:
    runs-on: ubuntu-latest
    concurrency:
      group: ci-govulncheck-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Package-level scanning instead of the default symbol level: the SSA
      # builder govulncheck uses for symbol analysis panics on a transitive
      # chromedp dependency ("got jsontext.Value, want variadic parameter of
      # unnamed slice or string type"). Package level still reports every
      # vulnerable package this module actually imports.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck -scan package ./...

  # The cross-compile gate for pull requests: nothing else here compiles the
  # Windows, macOS, 386 or ARM paths. On main the tag job cross-compiles the
  # same set with the release version stamped in, so building here too would
  # only produce a set of binaries nothing can ship.
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [test]
    concurrency:
      group: ci-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: cross-compile all targets
        run: make build-all
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/
          retention-days: 7

  # Semantic versioning. Once every check above is green on main, derive the
  # next version from the Conventional Commits since the last tag, build the
  # release set with it, and push the tag. A no-op when nothing since the last
  # tag warrants a bump (docs:, chore:, …).
  #
  # The cross-compile lives in this job rather than its own because the version
  # is stamped at link time: it is not known until `svu next` runs, and that has
  # to run inside this serialized job (see the concurrency note below). Building
  # before the tag push is also what keeps a broken target from leaving a tag
  # behind with no release attached to it.
  tag:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, lint, govulncheck]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Serialized, never cancelled: two pushes landing close together would
    # otherwise compute the same next version and one tag push would lose the
    # race, dropping a release that was due.
    concurrency:
      group: tag-main
      cancel-in-progress: false
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      # fetch-depth 0 brings the tags svu needs to find the last release.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: compute next version
        id: next
        run: |
          current=$(make version)
          next=$(make version-next)
          echo "current $current, next $next"
          if [ "$current" = "$next" ]; then
            echo "no release-worthy commits since $current"
            exit 0
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"
      - name: cross-compile all targets
        if: steps.next.outputs.version != ''
        env:
          TAG: ${{ steps.next.outputs.version }}
        run: make build-all VERSION="$TAG"
      - name: push tag
        if: steps.next.outputs.version != ''
        env:
          TAG: ${{ steps.next.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"
      # Handed to the release job, which publishes these exact files rather
      # than building the same tree a second time.
      - uses: actions/upload-artifact@v4
        if: steps.next.outputs.version != ''
        with:
          name: release-binaries
          path: dist/
          retention-days: 7

  release:
    needs: tag
    if: needs.tag.outputs.version != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.tag.outputs.version }}
