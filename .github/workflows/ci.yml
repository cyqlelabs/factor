name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: test (race)
        run: go test -race ./...
      - name: test (nobrowser tag)
        run: go test -tags nobrowser ./...
      - name: coverage gate
        run: make cover

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Package-level scanning instead of the default symbol level: the SSA
      # builder govulncheck uses for symbol analysis panics on a transitive
      # chromedp dependency ("got jsontext.Value, want variadic parameter of
      # unnamed slice or string type"). Package level still reports every
      # vulnerable package this module actually imports.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck -scan package ./...

  build:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: cross-compile all targets
        run: make build-all
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/
          retention-days: 7

  # Semantic versioning. Once every check above is green on main, derive the
  # next version from the Conventional Commits since the last tag and push it.
  # A no-op when nothing since the last tag warrants a bump (docs:, chore:, …).
  tag:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, lint, govulncheck, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Serialized, never cancelled: two pushes landing close together would
    # otherwise compute the same next version and one tag push would lose the
    # race, dropping a release that was due.
    concurrency:
      group: tag-main
      cancel-in-progress: false
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      # fetch-depth 0 brings the tags svu needs to find the last release.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: compute next version
        id: next
        run: |
          current=$(make version)
          next=$(make version-next)
          echo "current $current, next $next"
          if [ "$current" = "$next" ]; then
            echo "no release-worthy commits since $current"
            exit 0
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"
      - name: push tag
        if: steps.next.outputs.version != ''
        env:
          TAG: ${{ steps.next.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

  release:
    needs: tag
    if: needs.tag.outputs.version != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.tag.outputs.version }}
