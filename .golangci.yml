version: "2"

linters:
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (net.Listener).Close
        - (net.Conn).Close
        - (net/http.ResponseWriter).Write
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*bufio.Writer).Flush
  exclusions:
    rules:
      # wormhole-william, which pairing is built on, links nhooyr.io/websocket;
      # the swarm uses the same library rather than ship its fork beside it.
      - linters: [staticcheck]
        text: "SA1019: .*nhooyr.io/websocket"
